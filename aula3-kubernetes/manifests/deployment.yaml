apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-api
spec:
  replicas: 4

  selector:
    matchLabels:
      app: sentiment-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: sentiment-api
        dupla: manuella-lucas
        turma: "2026-2"
    spec:
      containers:
        - name: api
          image: ghcr.io/rodolfo-s-antunes/sentiment-api:v3
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3   # o modelo carrega em menos de 2 s, então 3 s de carência bastam
            periodSeconds: 3         # checagem mais frequente para detectar prontidão mais cedo
            failureThreshold: 2      # 2 falhas seguidas já indicam problema, sem esperar tanto quanto a prática

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20  # dá mais folga que a readiness para evitar reinício prematuro durante o rollout
            periodSeconds: 15        # menos frequente, já que liveness só precisa pegar travamentos persistentes
            failureThreshold: 4      # mais tolerante a falhas passageiras antes de reiniciar o container
