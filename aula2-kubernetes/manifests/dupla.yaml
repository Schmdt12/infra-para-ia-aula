apiVersion: v1
kind: Namespace
metadata:
  name: dupla-manu-lucas
---
apiVersion: v1
kind: Pod
metadata:
  name: sentiment-api
  namespace: dupla-manu-lucas
  labels:
    app: sentiment-api
    dupla: manu-lucas
    turma: 2026-2
spec:
  containers:
    - name: api
      image: ghcr.io/rodolfo-s-antunes/sentiment-api:v2
      ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-api
  namespace: dupla-manu-lucas
spec:
  type: LoadBalancer
  selector:
    dupla: manu-lucas
  ports:
    - port: 80
      targetPort: 8000
